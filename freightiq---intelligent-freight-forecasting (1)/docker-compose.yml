version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: freightiq-postgres
    environment:
      POSTGRES_DB: freightiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: freightiq-redis
    ports:
      - "6379:6379"

  # 3. Python ML Forecasting Microservice (FastAPI + statsmodels/Prophet)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: freightiq-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - redis

  # 4. Backend Orchestration API (Node/Express + Feasibility Engine)
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: freightiq-backend-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/freightiq
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=freightiq-sih2026-production-jwt-key
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  # 5. Frontend Web Application (React + Vite + Tailwind + Recharts)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freightiq-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend-api

volumes:
  pgdata:
